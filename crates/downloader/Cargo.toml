[package]
name = "archivindex-wbm-downloader"
description = "Async HTTP downloader for Wayback Machine snapshots"
keywords = ["wayback-machine", "web-archive", "downloader"]
categories = ["web-programming"]
authors.workspace = true
repository.workspace = true
version.workspace = true
exclude = ["tests/"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
archivindex-publication.workspace = true
archivindex-wbm.workspace = true
archivindex-wbm-invalid-log.workspace = true
bounded-static.workspace = true
bytes.workspace = true
chrono.workspace = true
http.workspace = true
log.workspace = true
reqwest = { workspace = true, features = ["socks"] }
rusqlite.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-retry.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Network and I/O features support the local SOCKS proxy tests.
tokio = { workspace = true, features = ["io-util", "net", "time"] }
wiremock.workspace = true
