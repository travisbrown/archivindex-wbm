[package]
name = "archivindex-wbm-json-processing"
description = "I/O and batch processing for Wayback Machine JSON snapshot files"
keywords = ["wayback-machine", "web-archive", "json"]
categories = ["encoding", "filesystem"]
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
version.workspace = true
exclude = ["tests/"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
archivindex-lines.workspace = true
archivindex-wbm.workspace = true
archivindex-wbm-invalid-log.workspace = true
archivindex-wbm-json.workspace = true
bounded-static.workspace = true
futures.workspace = true
log.workspace = true
rayon.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
toml.workspace = true
zstd.workspace = true

[dev-dependencies]
# `compact_test` reproduces gzip archives, which needs the zlib path rather than just the pure-Rust
# Go port, so the feature is requested explicitly instead of relying on defaults.
archivindex-wbm-json-gzip = { workspace = true, features = ["zlib"] }
# `ops_test` timestamps the invalid-digest log entries it inserts.
chrono.workspace = true
tempfile.workspace = true
tokio.workspace = true
