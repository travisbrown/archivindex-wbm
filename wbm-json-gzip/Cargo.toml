[package]
name = "archivindex-wbm-json-gzip"
description = "Byte-exact gzip reproduction for archivindex-wbm-json snapshots"
keywords = ["wayback-machine", "web-archive", "gzip"]
categories = ["compression"]
authors = { workspace = true }
repository = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
# See LICENSE-GO and PATENTS-GO.
license = "AGPL-3.0-only AND BSD-3-Clause"
readme = { workspace = true }
version = { workspace = true }
exclude = ["tests/"]

[features]
default = ["zlib"]
zlib = ["dep:libz-sys", "dep:libz-ng-sys"]

[dependencies]
archivindex-wbm-json = { version = "0.1.0", path = "../wbm-json/" }
flate2 = { workspace = true }
# The `static` feature builds the vendored zlib from source; linking the system zlib would make
# byte-exact reproduction vary by build host.
libz-sys = { workspace = true, optional = true, features = ["static"] }
libz-ng-sys = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
archivindex-wbm = { path = "../wbm/" }
archivindex-wbm-test-data = { path = "../wbm-test-data/" }
sha1 = { workspace = true }
tokio = { workspace = true }
