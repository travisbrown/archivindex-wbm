[workspace]
resolver = "3"
members = [
  "cdx-client",
  "cdx-client-cli",
  "hacks",
  "wbm",
  "wbm-cas",
  "wbm-cdx-index",
  "wbm-cdx-index-cli",
  "wbm-downloader",
  "wbm-downloader-cli",
  "wbm-invalid-log",
  "wbm-json",
  "wbm-json-cli",
  "wbm-json-gzip",
  "wbm-json-processing",
  "wbm-test-data",
]
default-members = [
  "cdx-client",
  "cdx-client-cli",
  "wbm",
  "wbm-cas",
  "wbm-cdx-index",
  "wbm-cdx-index-cli",
  "wbm-downloader",
  "wbm-downloader-cli",
  "wbm-invalid-log",
  "wbm-json",
  "wbm-json-cli",
  "wbm-json-gzip",
  "wbm-json-processing",
  "wbm-test-data",
]

[workspace.package]
authors = ["Travis Brown <travisrobertbrown@gmail.com>"]
repository = "https://github.com/travisbrown/archivindex"
edition = "2024"
rust-version = "1.91"
license = "AGPL-3.0-only"
readme = "README.md"
version = "0.1.0"

[workspace.dependencies]
archivindex-archiver = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex-warc" }
archivindex-cdx = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-surt = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex", default-features = false }
bounded-static = { version = "0.8", features = ["derive"] }
bytes = "1"
cel = "0.14"
chrono = { version = "0.4", features = ["serde"] }
cli-helpers = "0.1"
csv = "1"
data-encoding = "2"
digest-io = "0.1"
futures = "0.3"
flate2 = "1"
http = "1"
indicatif = "0.18"
# Precise minimum versions (caret requirements, not pins) tested for byte-exact gzip reproduction
# in `archivindex-wbm-json-gzip`.
libz-sys = "1.1.29"
libz-ng-sys = "1.1.29"
log = "0.4"
prefix-file-tree = "0.5"
proptest = "1"
rayon = "1"
regex = "1"
reqwest = { version = "0.13", features = ["json"] }
rusqlite = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.11"
tempfile = "3"
test-strategy = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-retry = "0.3"
tokio-stream = "0.1"
toml = "1"
url = { version = "2", features = ["serde"] }
wiremock = "0.6"
rocksdb = { version = "0.25", features = ["zstd"] }
zstd = "0.13"

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
