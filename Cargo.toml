[workspace]
resolver = "3"
members = [
  "crates/cas",
  "crates/cdx-client",
  "crates/cdx-index",
  "crates/downloader",
  "crates/invalid-log",
  "crates/json",
  "crates/json-gzip",
  "crates/json-processing",
  "crates/test-data",
  "crates/wbm",
  "tools/cdx-client-cli",
  "tools/cdx-index-cli",
  "tools/downloader-cli",
  "tools/hacks",
  "tools/json-cli",
]
default-members = [
  "crates/cas",
  "crates/cdx-client",
  "crates/cdx-index",
  "crates/downloader",
  "crates/invalid-log",
  "crates/json",
  "crates/json-gzip",
  "crates/json-processing",
  "crates/test-data",
  "crates/wbm",
  "tools/cdx-client-cli",
  "tools/cdx-index-cli",
  "tools/downloader-cli",
  "tools/json-cli",
]

[workspace.package]
authors = ["Travis Brown <travisrobertbrown@gmail.com>"]
repository = "https://github.com/travisbrown/archivindex-wbm"
edition = "2024"
rust-version = "1.91"
license = "AGPL-3.0-only"
readme = "README.md"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
archivindex-archiver = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex-warc" }
archivindex-cdx = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-cli-support = { git = "https://github.com/travisbrown/archivindex" }
archivindex-digest = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-serde = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-surt = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex", default-features = false }
# Shared test helpers, used only by dev-dependencies. Declared without a version because the crate
# is `publish = false`, so `cargo package` strips it from the crates that depend on it.
archivindex-test-support = { git = "https://github.com/travisbrown/archivindex" }
archivindex-warc = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex-warc" }
archivindex-wbm = { version = "0.1.0", path = "crates/wbm" }
# Compression is opt-in: `archivindex-wbm-test-data` stores its cache uncompressed.
archivindex-wbm-cas = { version = "0.1.0", path = "crates/cas", default-features = false }
archivindex-wbm-cdx-client = { version = "0.1.0", path = "crates/cdx-client" }
archivindex-wbm-cdx-index = { version = "0.1.0", path = "crates/cdx-index" }
archivindex-wbm-downloader = { version = "0.1.0", path = "crates/downloader" }
archivindex-wbm-invalid-log = { version = "0.1.0", path = "crates/invalid-log" }
archivindex-wbm-json = { version = "0.1.0", path = "crates/json" }
archivindex-wbm-json-gzip = { version = "0.1.0", path = "crates/json-gzip" }
archivindex-wbm-json-processing = { version = "0.1.0", path = "crates/json-processing" }
archivindex-wbm-test-data = { version = "0.1.0", path = "crates/test-data" }
bounded-static = { version = "0.8", features = ["derive"] }
bytes = "1"
cel = "0.14"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
data-encoding = "2"
digest-io = "0.1"
flate2 = "1"
futures = "0.3"
http = "1"
humantime = "2"
indicatif = "0.18"
# Precise minimum versions (caret requirements, not pins) tested for byte-exact gzip reproduction
# in `archivindex-wbm-json-gzip`.
libz-ng-sys = "1.1.29"
libz-sys = "1.1.29"
log = "0.4"
prefix-file-tree = "0.5"
proptest = "1"
rayon = "1"
redb = "4"
regex = "1"
reqwest = { version = "0.13", features = ["json"] }
rusqlite = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.11"
tempfile = "3"
test-strategy = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-retry = "0.3"
tokio-stream = "0.1"
toml = "1"
url = { version = "2", features = ["serde"] }
wiremock = "0.6"
zstd = "0.14"

[[workspace.metadata.archivindex-build.exemptions]]
package = "archivindex-wbm-json-gzip"
rule = "package.license"
reason = "The vendored Go compression code is BSD-3-Clause; see LICENSE-GO and PATENTS-GO."

[[workspace.metadata.archivindex-build.exemptions]]
package = "archivindex-wbm-json-gzip"
rule = "lints.workspace"
reason = "Its FFI modules need narrowly scoped `allow(unsafe_code)`."

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
