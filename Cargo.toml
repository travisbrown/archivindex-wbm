[workspace]
resolver = "2"
members = [
    "hacks",
    "wbm",
    "wbm-cas",
    "wbm-cdx-index",
    "wbm-cdx-index-cli",
    "wbm-downloader",
    "wbm-downloader-cli",
    "wbm-invalid-log",
    "wbm-json",
    "wbm-json-cli",
    "wbm-json-gzip",
]
default-members = [
    "wbm",
    "wbm-cas",
    "wbm-cdx-index",
    "wbm-cdx-index-cli",
    "wbm-downloader",
    "wbm-downloader-cli",
    "wbm-invalid-log",
    "wbm-json",
    "wbm-json-cli",
    "wbm-json-gzip",
]

[workspace.package]
authors = ["Travis Brown <travisrobertbrown@gmail.com>"]
repository = "https://github.com/travisbrown/archivindex"
edition = "2024"
license = "AGPL-3.0-only"
readme = "README.md"
version = "0.1.0"

[workspace.dependencies]
bounded-static = { version = "0.8", features = ["derive"] }
bytes = "1"
cel = "0.14"
chrono = { version = "0.4", features = ["serde"] }
cli-helpers = "0.1"
csv = "1"
data-encoding = "2"
digest-io = "0.1"
futures = "0.3"
flate2 = "1"
http = "1"
libz-sys = "1.1.29"
libz-ng-sys = "1.1.29"
log = "0.4"
prefix-file-tree = "0.4"
proptest = "1"
rayon = "1"
regex = "1"
reqwest = { version = "0.13", features = ["json"] }
rusqlite = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.11"
tempfile = "3"
test-strategy = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-retry = "0.3"
tokio-stream = "0.1"
toml = "1"
url = { version = "2", features = ["serde"] }
rocksdb = { version = "0.24", features = ["zstd"] }
zstd = "0.13"
