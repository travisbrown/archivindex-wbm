[package]
name = "archivindex-wbm-json-processing"
description = "I/O and batch processing for Wayback Machine JSON snapshot files"
keywords = ["wayback-machine", "web-archive", "json"]
categories = ["encoding", "filesystem"]
authors = { workspace = true }
repository = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
version = { workspace = true }

[dependencies]
archivindex-wbm = { version = "0.1.0", path = "../wbm/" }
archivindex-wbm-invalid-log = { version = "0.1.0", path = "../wbm-invalid-log/" }
archivindex-wbm-json = { version = "0.1.0", path = "../wbm-json/" }
bounded-static = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
# `compact_test` reproduces gzip archives, which needs the zlib path rather than just the
# pure-Rust Go port, so the feature is requested explicitly instead of relying on defaults.
archivindex-wbm-json-gzip = { path = "../wbm-json-gzip/", features = ["zlib"] }
# `ops_test` timestamps the invalid-digest log entries it inserts.
chrono = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
