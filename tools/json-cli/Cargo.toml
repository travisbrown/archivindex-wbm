[package]
name = "archivindex-wbm-json-cli"
authors.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "archivindex-wbm-json"
path = "src/main.rs"
# Avoid a rustdoc output-filename collision with the `archivindex-wbm-json` library crate.
doc = false

[dependencies]
anyhow.workspace = true
archivindex-cli-support.workspace = true
archivindex-wbm.workspace = true
archivindex-wbm-cas = { workspace = true, features = ["zstd"] }
archivindex-wbm-invalid-log.workspace = true
archivindex-wbm-json.workspace = true
archivindex-wbm-json-gzip.workspace = true
archivindex-wbm-json-processing.workspace = true
clap.workspace = true
csv.workspace = true
flate2.workspace = true
log.workspace = true
serde_json.workspace = true
sha1.workspace = true
tokio.workspace = true
toml.workspace = true
zstd.workspace = true

[dev-dependencies]
tempfile.workspace = true
