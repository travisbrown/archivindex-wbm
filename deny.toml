[graph]
all-features = true

[advisories]
version = 2

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path dependency on a package that is never published cannot carry a version requirement.
allow-wildcard-paths = true

[licenses]
version = 2
allow = [
  "0BSD",
  "AGPL-3.0-only",
  "Apache-2.0",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-only",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
exceptions = [{ crate = "prefix-file-tree", allow = ["GPL-3.0-only"] }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The shared archiver, CDX, and SURT crates are consumed from their repositories until they are
# published.
allow-git = [
  "https://github.com/travisbrown/archivindex",
  "https://github.com/travisbrown/archivindex-warc",
]
