[package]
name = "archivindex-wbm-downloader-cli"
authors = { workspace = true }
repository = { workspace = true }
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
publish = false

[[bin]]
name = "archivindex-wbm-downloader"
path = "src/main.rs"
# Avoid a rustdoc output-filename collision with the `archivindex-wbm-downloader` library crate.
doc = false

[dependencies]
archivindex-wbm = { path = "../wbm/" }
archivindex-wbm-cas = { path = "../wbm-cas/" }
archivindex-wbm-downloader = { path = "../wbm-downloader/" }
archivindex-wbm-invalid-log = { path = "../wbm-invalid-log/" }
bounded-static = { workspace = true }
chrono = { workspace = true }
cli-helpers = { workspace = true }
csv = { workspace = true }
# For the `reqwest::Error` returned by `Manager::new` when the HTTP client cannot be built.
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
